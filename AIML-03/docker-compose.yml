# API + Redis (+ Triton with `--profile triton`). Needs a built bundle in ./bundle (see README).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
  api:
    build: .
    depends_on: [redis]
    environment:
      REDIS_URL: redis://redis:6379/0
      # TRITON_URL: http://triton:8000      # uncomment together with the triton profile to score on Triton
    volumes: ["./bundle:/bundle:ro"]
    ports: ["8000:8000"]
  triton:
    profiles: ["triton"]
    image: nvcr.io/nvidia/tritonserver:24.08-py3   # large image; the TensorFlow backend ships in the full py3 image
    command: ["tritonserver", "--model-repository=/models"]
    volumes: ["./triton/model_repository:/models:ro"]
    ports: ["8100:8000"]
